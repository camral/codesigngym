<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Inter',Arial,sans-serif" role="img" aria-label="Pokemon Showdown battle: team design versus a chosen opponent.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf1fb"/><stop offset="1" stop-color="#d7e3f5"/></linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3c2"/><stop offset="1" stop-color="#8fce9a"/></linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- battle field ellipses -->
  <ellipse cx="180" cy="300" rx="150" ry="42" fill="url(#field)" opacity="0.9"/>
  <ellipse cx="470" cy="150" rx="120" ry="34" fill="url(#field)" opacity="0.75"/>
  <!-- HP bars -->
  <g>
    <rect x="360" y="70" width="230" height="44" rx="8" fill="#ffffff" opacity="0.92" stroke="#c3ccdb"/>
    <text x="374" y="90" font-size="13" font-weight="700" fill="#334155">Opponent</text>
    <rect x="374" y="98" width="200" height="8" rx="4" fill="#e4e8f0"/><rect x="374" y="98" width="120" height="8" rx="4" fill="#e0563b"/>
    <rect x="50" y="250" width="230" height="44" rx="8" fill="#ffffff" opacity="0.92" stroke="#c3ccdb"/>
    <text x="64" y="270" font-size="13" font-weight="700" fill="#334155">Your designed team</text>
    <rect x="64" y="278" width="200" height="8" rx="4" fill="#e4e8f0"/><rect x="64" y="278" width="176" height="8" rx="4" fill="#2ea56a"/>
  </g>
  <!-- pokeballs (team of 6) -->
  <g>
    <g transform="translate(150 300)">
      <circle r="34" fill="#ffffff" stroke="#1a2233" stroke-width="3"/>
      <path d="M -34 0 A 34 34 0 0 1 34 0 Z" fill="#e0563b" stroke="#1a2233" stroke-width="3"/>
      <line x1="-34" y1="0" x2="34" y2="0" stroke="#1a2233" stroke-width="3"/>
      <circle r="9" fill="#ffffff" stroke="#1a2233" stroke-width="3"/>
    </g>
    <g transform="translate(470 150) scale(0.72)">
      <circle r="34" fill="#ffffff" stroke="#1a2233" stroke-width="3"/>
      <path d="M -34 0 A 34 34 0 0 1 34 0 Z" fill="#f0a03c" stroke="#1a2233" stroke-width="3"/>
      <line x1="-34" y1="0" x2="34" y2="0" stroke="#1a2233" stroke-width="3"/>
      <circle r="9" fill="#ffffff" stroke="#1a2233" stroke-width="3"/>
    </g>
  </g>
  <!-- team roster dots -->
  <g transform="translate(64 320)">
    <text x="0" y="0" font-size="12" font-weight="600" fill="#55617a">roster</text>
    <g fill="#12897f">
      <circle cx="58" cy="-4" r="7"/><circle cx="80" cy="-4" r="7"/><circle cx="102" cy="-4" r="7"/>
      <circle cx="124" cy="-4" r="7" fill="#c8324a"/><circle cx="146" cy="-4" r="7" fill="#c8324a"/><circle cx="168" cy="-4" r="7" fill="#4b3f9e"/>
    </g>
  </g>
  <text x="24" y="42" font-size="20" font-weight="800" fill="#1a2233">Pok&#233;mon Showdown</text>
  <text x="24" y="62" font-size="13" fill="#55617a">team composition = embodiment &#183; battle strategy = policy</text>
</svg>
