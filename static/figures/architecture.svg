<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="'Inter','Helvetica Neue',Arial,sans-serif" role="img" aria-label="Codesign Gym architecture: make_vec resolves an env id through a lazy registry to a per-env build_vec that returns a native vectorized environment.">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8792a8"/></marker>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1a2233" flood-opacity="0.10"/></filter>
  </defs>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#1a2233">One entry point, a lazy registry, native vectorization</text>
  <text x="40" y="72" font-size="14" fill="#6b7590">heavy deps (MuJoCo, JAX, Showdown) never import until their env id is actually requested</text>

  <!-- package legend -->
  <g font-size="12.5" font-weight="600">
    <circle cx="712" cy="42" r="6" fill="#4b3f9e"/><text x="724" y="46" fill="#55617a">codesign_gym/</text>
    <circle cx="838" cy="42" r="6" fill="#334155"/><text x="850" y="46" fill="#55617a">core/</text>
    <circle cx="912" cy="42" r="6" fill="#12897f"/><text x="924" y="46" fill="#55617a">envs/</text>
  </g>

  <!-- pipeline nodes -->
  <!-- 1 call -->
  <g filter="url(#s2)"><rect x="300" y="104" width="440" height="58" rx="12" fill="#1a2233"/></g>
  <text x="520" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="#e6ebf5" font-family="'SFMono-Regular',ui-monospace,Menlo,monospace">env, base_embodiment = make_vec(</text>
  <text x="520" y="151" text-anchor="middle" font-size="13" fill="#9fb0cc" font-family="'SFMono-Regular',ui-monospace,Menlo,monospace">"NeroGraspTiny", num_envs=8, is_eval_env=False)</text>

  <path d="M520 162 L520 190" stroke="#8792a8" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 2 public api -->
  <g filter="url(#s2)"><rect x="290" y="192" width="460" height="66" rx="12" fill="#ffffff" stroke="#4b3f9e" stroke-width="1.8"/></g>
  <text x="520" y="218" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4b3f9e">codesign_gym.make_vec()</text>
  <text x="520" y="240" text-anchor="middle" font-size="12" fill="#6b7590">the only public entry &#183; make() = make_vec(num_envs=1) &#183; list_envs()</text>

  <path d="M520 258 L520 286" stroke="#8792a8" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 3 registry -->
  <g filter="url(#s2)"><rect x="290" y="288" width="460" height="72" rx="12" fill="#f4f2fc" stroke="#c9c1ec" stroke-width="1.4"/></g>
  <text x="520" y="313" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4b3f9e">registry.py &#160;&#183;&#160; REGISTRY[env_id]</text>
  <text x="520" y="335" text-anchor="middle" font-size="12.5" fill="#55617a" font-family="'SFMono-Regular',ui-monospace,Menlo,monospace">"envs.nerograsp.registration:build_vec"</text>
  <text x="520" y="352" text-anchor="middle" font-size="11.5" fill="#8792a8">+ default kwargs &#183; discriminator (setup= / opponent= / object_name=)</text>

  <path d="M520 360 L520 388" stroke="#8792a8" stroke-width="2" marker-end="url(#a2)"/>
  <text x="620" y="378" font-size="11.5" font-style="italic" fill="#9333a8">_lazy_import &#8212; import on demand</text>

  <!-- 4 build_vec -->
  <g filter="url(#s2)"><rect x="290" y="390" width="460" height="66" rx="12" fill="#ffffff" stroke="#12897f" stroke-width="1.8"/></g>
  <text x="520" y="416" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f766e">envs/&lt;name&gt;/registration.py &#183; build_vec(&#8230;)</text>
  <text x="520" y="438" text-anchor="middle" font-size="12" fill="#6b7590">max_action_space_size &#183; max_observation_space_size (pad / bound)</text>

  <path d="M520 456 L520 484" stroke="#8792a8" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 5 native vec env -->
  <g filter="url(#s2)"><rect x="230" y="486" width="580" height="90" rx="14" fill="#eafaf6" stroke="#12897f" stroke-width="1.6"/></g>
  <text x="520" y="512" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f766e">native vectorized env &#160;&#8594;&#160; exposes base_embodiment</text>
  <g font-size="11.5" font-weight="600">
    <rect x="252" y="526" width="150" height="24" rx="12" fill="#ffffff" stroke="#bfe9e0"/><text x="327" y="542" text-anchor="middle" fill="#0f766e">JAX vmap (jumanji, f1tenth)</text>
    <rect x="412" y="526" width="150" height="24" rx="12" fill="#ffffff" stroke="#bfe9e0"/><text x="487" y="542" text-anchor="middle" fill="#0f766e">process shards (Showdown)</text>
    <rect x="572" y="526" width="164" height="24" rx="12" fill="#ffffff" stroke="#bfe9e0"/><text x="654" y="542" text-anchor="middle" fill="#0f766e">MuJoCo Warp / vmap</text>
  </g>
  <text x="520" y="566" text-anchor="middle" font-size="11.5" fill="#6b7590">reset() &#8594; (obs, embodiment_rejected, info) &#160;&#183;&#160; num_envs=1 wrapped in SingleEnv</text>

  <!-- core sidebar -->
  <g filter="url(#s2)"><rect x="830" y="192" width="176" height="264" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.6"/></g>
  <text x="918" y="218" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">core/</text>
  <line x1="850" y1="228" x2="986" y2="228" stroke="#e2e6ef"/>
  <text x="918" y="250" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2233">CoDesignEnv</text>
  <text x="918" y="270" text-anchor="middle" font-size="11" fill="#6b7590">gym.Env + design axis</text>
  <text x="850" y="298" font-size="11.5" fill="#55617a">&#183; embodiment_space</text>
  <text x="850" y="318" font-size="11.5" fill="#55617a">&#183; _reset / _step hooks</text>
  <text x="850" y="338" font-size="11.5" fill="#55617a">&#183; validate_embodiment</text>
  <text x="850" y="358" font-size="11.5" fill="#55617a">&#160;&#160;(structural only)</text>
  <line x1="850" y1="374" x2="986" y2="374" stroke="#e2e6ef"/>
  <text x="918" y="398" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2233">is_eval_env</text>
  <text x="918" y="418" text-anchor="middle" font-size="11" fill="#6b7590">drops step-time &#952;</text>
  <text x="918" y="438" text-anchor="middle" font-size="11" fill="#6b7590">so eval design is fixed</text>

  <path d="M830 300 C 800 300, 780 300, 752 282" stroke="#334155" stroke-width="1.4" fill="none" stroke-dasharray="4 4" marker-end="url(#a2)"/>

  <!-- envs footer -->
  <text x="40" y="612" font-size="12.5" fill="#8792a8"><tspan font-weight="700" fill="#0f766e">Add an env:</tspan> drop envs/&lt;name&gt;/registration.py exposing build_vec, add one row to REGISTRY. That is the whole contract.</text>
</svg>
