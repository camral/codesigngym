<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'Inter','Helvetica Neue',Arial,sans-serif" role="img" aria-label="The co-design loop: an embodiment design and a control policy are optimized together against a shared environment.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#12897f"/>
    </marker>
    <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c8324a"/>
    </marker>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1a2233" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- title strip -->
  <text x="520" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2233">A doubly non&#8209;stationary optimization</text>
  <text x="520" y="66" text-anchor="middle" font-size="14.5" fill="#6b7590">the agent&#8217;s <tspan font-weight="600" fill="#12897f">embodiment</tspan> is optimized alongside its <tspan font-weight="600" fill="#c8324a">control policy</tspan></text>

  <!-- nested timescale frames: outer = design (slow), inner = control (fast) -->
  <rect x="64" y="120" width="912" height="320" rx="26" fill="none" stroke="#12897f" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.65"/>
  <rect x="360" y="140" width="600" height="284" rx="22" fill="none" stroke="#c8324a" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.55"/>
  <g font-size="12" font-weight="700" letter-spacing="0.3">
    <rect x="84" y="110" width="238" height="22" rx="11" fill="#eafaf6"/>
    <text x="98" y="125.5" fill="#0f766e">OUTER LOOP &#183; optimize embodiment &#952; (slow)</text>
    <rect x="716" y="130" width="230" height="22" rx="11" fill="#fdecef"/>
    <text x="730" y="145.5" fill="#c8324a">INNER LOOP &#183; optimize control &#960; (fast)</text>
  </g>

  <!-- ENV center -->
  <rect x="380" y="228" width="280" height="150" rx="18" fill="url(#env)" stroke="#c9d0e0" stroke-width="1.5" filter="url(#soft)"/>
  <text x="520" y="266" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2233">Co-Design Environment</text>
  <text x="520" y="288" text-anchor="middle" font-size="12" fill="#8792a8">Gymnasium&#8209;compatible &#183; vectorized</text>
  <g font-size="12.5" font-weight="600">
    <rect x="404" y="306" width="106" height="26" rx="13" fill="#eafaf6" stroke="#bfe9e0"/>
    <text x="457" y="323" text-anchor="middle" fill="#0f766e">reset(&#952;)</text>
    <rect x="522" y="306" width="114" height="26" rx="13" fill="#eafaf6" stroke="#bfe9e0"/>
    <text x="579" y="323" text-anchor="middle" fill="#0f766e">step(a,&#952;)</text>
    <rect x="404" y="340" width="232" height="26" rx="13" fill="#f4f6fb" stroke="#d7deeb"/>
    <text x="520" y="357" text-anchor="middle" fill="#55617a">obs&#160;&#183;&#160;reward&#160;&#183;&#160;embodiment_rejected</text>
  </g>

  <!-- EMBODIMENT node (left) -->
  <g filter="url(#soft)">
    <rect x="96" y="150" width="196" height="96" rx="16" fill="#ffffff" stroke="#12897f" stroke-width="2"/>
  </g>
  <text x="194" y="182" text-anchor="middle" font-size="15.5" font-weight="700" fill="#12897f">Embodiment &#952;</text>
  <text x="194" y="203" text-anchor="middle" font-size="11.5" fill="#6b7590">design &#183; morphology</text>
  <text x="194" y="219" text-anchor="middle" font-size="11.5" fill="#6b7590">team &#183; layout &#183; sizing</text>
  <text x="194" y="235" text-anchor="middle" font-size="10.5" fill="#9aa3b8" font-style="italic">any optimizer</text>

  <!-- POLICY node (right) -->
  <g filter="url(#soft)">
    <rect x="748" y="150" width="196" height="96" rx="16" fill="#ffffff" stroke="#c8324a" stroke-width="2"/>
  </g>
  <text x="846" y="182" text-anchor="middle" font-size="15.5" font-weight="700" fill="#c8324a">Control Policy &#960;</text>
  <text x="846" y="203" text-anchor="middle" font-size="11.5" fill="#6b7590">steering &#183; dispatch</text>
  <text x="846" y="219" text-anchor="middle" font-size="11.5" fill="#6b7590">moves &#183; joint torques</text>
  <text x="846" y="235" text-anchor="middle" font-size="10.5" fill="#9aa3b8" font-style="italic">RL / control</text>

  <!-- design -> env -->
  <path d="M 292 210 C 340 214, 348 250, 378 268" fill="none" stroke="#12897f" stroke-width="2.4" marker-end="url(#ahT)"/>
  <text x="344" y="238" text-anchor="middle" font-size="11.5" font-weight="600" fill="#12897f">&#952;</text>

  <!-- env -> policy (obs) -->
  <path d="M 662 300 C 706 300, 720 250, 746 224" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="712" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#55617a">obs</text>

  <!-- policy -> env (action) -->
  <path d="M 746 200 C 700 196, 690 250, 662 268" fill="none" stroke="#c8324a" stroke-width="2.4" marker-end="url(#ahR)"/>
  <text x="704" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#c8324a">action a</text>

  <!-- return path env -> design (reward) around bottom-left -->
  <path d="M 380 348 C 292 372, 244 322, 240 258" fill="none" stroke="#12897f" stroke-width="2.2" marker-end="url(#ahT)"/>
  <text x="290" y="366" text-anchor="middle" font-size="11" font-weight="600" fill="#12897f">reward &#183; return</text>

  <!-- footer note -->
  <text x="520" y="510" text-anchor="middle" font-size="12.5" fill="#8792a8">design and policy quality cannot be judged independently &#8212; the environment is non&#8209;stationary in both</text>
</svg>
